<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:" />
<title>GMeet ISO</title>
<link rel="stylesheet" href="control.css" />
</head>
<body>
<header>
  <div class="meeting" id="meetingBar" data-state="idle">
    <div class="entry">
      <input id="meetUrl" placeholder="Paste a Meet link or code" spellcheck="false" />
      <button id="joinBtn" class="primary">Join</button>
      <button id="signInBtn" class="primary" hidden>Sign in to Google</button>
    </div>
    <div class="call">
      <span class="indicator"></span>
      <span class="call-label" id="callLabel"></span>
      <span class="call-code" id="callCode"></span>
      <span class="call-timer" id="callTimer"></span>
      <button id="leaveBtn" class="danger">Leave</button>
    </div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div id="ndiStatus" class="pill bad" hidden></div>

  <div class="engine" id="engine" title="ISO engine">
    <button data-engine="disabled">Off</button>
    <button data-engine="standby">Standby</button>
    <button data-engine="enabled">Live</button>
  </div>
  <button id="recAllBtn" class="rec-btn" title="Record all enabled outputs"><span class="rec-dot"></span>Rec</button>
  <div class="menu">
    <button id="showBtn" title="Show file">Show ▾</button>
    <div class="menu-list" id="showMenu" hidden>
      <button data-show="open">Open show…</button>
      <button data-show="merge">Merge show…</button>
      <button data-show="save">Save show as…</button>
    </div>
  </div>
  <div class="sys" id="sysStats"></div>
</header>

<div class="body">
  <main>
    <nav class="tabs">
      <button class="tab active" data-tab="outputs">Outputs <span class="count" id="outCount"></span></button>
      <button class="tab" data-tab="participants">Participants <span class="count" id="partCount"></span></button>
      <span class="spacer"></span>
      <span class="view-toggle" id="viewToggle">
        <button data-view="grid" title="Grid">▦</button>
        <button data-view="list" title="List">☰</button>
      </span>
    </nav>

    <section id="tab-outputs" class="tabpane">
      <div id="outputs" class="outputs grid"></div>
    </section>

    <section id="tab-participants" class="tabpane" hidden>
      <div id="roster" class="roster"></div>
      <div id="rosterEmpty" class="empty-inline">Not in a meeting</div>
    </section>
  </main>

  <aside>
    <section class="card">
      <h2>Bot output</h2>
      <div class="preview-box"><img id="botPreview" alt="" /><div class="preview-label" id="botCamStatus">No camera source</div></div>
      <label>Camera source
        <span class="row"><select id="camSource"></select><button id="refreshNdi" title="Refresh NDI sources">⟳</button></span>
      </label>
      <label>Microphone
        <select id="micSource"></select>
      </label>
      <div class="muted small" id="micActive"></div>
      <div class="toggles">
        <button id="camToggle" class="toggle" disabled>Camera</button>
        <button id="micToggle" class="toggle" disabled>Mic</button>
      </div>
    </section>

    <section class="card" id="meetingTools">
      <h2>Meeting</h2>
      <div id="waitingBox" class="waiting" hidden>
        <div class="waiting-head"><span id="waitingText"></span><button id="admitAllBtn" class="primary small-btn">Admit all</button></div>
      </div>
      <span class="row"><input id="chatText" placeholder="Message everyone" /><button id="chatBtn">Send</button></span>
      <label class="check"><input id="s_autoAdmit" type="checkbox" /> Admit everyone automatically</label>
      <label class="check"><input id="s_autoLayout" type="checkbox" /> Force tiled layout</label>
      <span class="row"><label class="grow">Max tiles <select id="s_maxTiles"><option>6</option><option>9</option><option>16</option><option>25</option><option>36</option><option>49</option></select></label><button id="layoutBtn" class="align-end">Apply</button></span>
      <label>Monitor meeting audio on
        <select id="s_monitorDevice"></select>
      </label>
    </section>

    <section class="card">
      <details>
        <summary><h2>Settings</h2></summary>
        <h3>General</h3>
        <label>Join notice (chat) <input id="s_joinNotice" placeholder="(none)" /></label>
        <label>New output prefix <input id="s_ndiPrefix" /></label>
        <span class="row2">
          <label>Hold after leave (s) <input id="s_graceSeconds" type="number" min="0" max="600" /></label>
          <label>Preview FPS <input id="s_previewFps" type="number" min="1" max="30" /></label>
        </span>
        <label class="check"><input id="s_screenShare" type="checkbox" /> Capture screen shares</label>
        <label class="check"><input id="s_includeSelf" type="checkbox" /> Include bot's own tile</label>
        <label class="check"><input id="s_autoJoin" type="checkbox" /> Join automatically</label>
        <label class="check"><input id="s_muteLocalAudio" type="checkbox" /> Mute meeting audio on this PC</label>
        <label>Bot account name <input id="s_botName" placeholder="auto-detected" /></label>
        <span class="row2">
          <label>Meet viewport W <input id="s_meetWindowWidth" type="number" min="640" /></label>
          <label>H <input id="s_meetWindowHeight" type="number" min="360" /></label>
        </span>

        <h3>Recording</h3>
        <span class="row"><input id="s_recordDir" placeholder="Videos\GMeet ISO" /><button id="pickRecordDir">…</button></span>

        <h3>NDI network</h3>
        <label>Groups <input id="s_ndiGroups" placeholder="(default)" /></label>
        <label>Discovery server <input id="s_ndiDiscoveryServer" placeholder="host:5959 (blank = mDNS)" /></label>
        <label>Network adapters (IPs) <input id="s_ndiNicIps" placeholder="(all)" /></label>

        <h3>Remote control</h3>
        <label class="check"><input id="s_oscEnabled" type="checkbox" /> OSC</label>
        <span class="row2">
          <label>Listen port <input id="s_oscListenPort" type="number" /></label>
          <label>Reply port <input id="s_oscReplyPort" type="number" /></label>
        </span>
        <label>Reply host <input id="s_oscReplyHost" placeholder="sender" /></label>
        <label class="check"><input id="s_apiEnabled" type="checkbox" /> HTTP / WebSocket API</label>
        <label>API port <input id="s_apiPort" type="number" /></label>
        <div class="muted small" id="remoteInfo"></div>

        <button id="dumpBtn" class="small-btn">Diagnostics: dump Meet DOM</button>
      </details>
    </section>
  </aside>
</div>

<!-- Per-output effects / advanced drawer -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-head"><h2 id="drawerTitle">Output</h2><button id="drawerClose">✕</button></div>
  <div class="drawer-body">
    <h3>Output</h3>
    <label>Name (NDI source) <input id="d_name" /></label>
    <label>When the participant is gone
      <select id="d_failover"><option value="loss">Show loss mode</option><option value="activeSpeaker">Fall back to active speaker</option></select>
    </label>
    <span class="row"><label class="grow">Loss image <input id="d_lossImage" placeholder="(none)" /></label><button id="d_pickImage" class="align-end">…</button></span>
    <label>Display output <select id="d_display"></select></label>
    <h3>Audio</h3>
    <span class="row2">
      <label>Gain (dB) <input id="d_audioGainDb" type="number" step="0.5" min="-40" max="20" /></label>
      <label>Delay (ms) <input id="d_audioDelayMs" type="number" step="10" min="0" max="2000" /></label>
    </span>
    <h3>Picture</h3>
    <label>Brightness <input id="e_brightness" type="range" min="0" max="2" step="0.01" /></label>
    <label>Contrast <input id="e_contrast" type="range" min="0" max="2" step="0.01" /></label>
    <label>Saturation <input id="e_saturation" type="range" min="0" max="2" step="0.01" /></label>
    <label>Hue <input id="e_hue" type="range" min="-180" max="180" step="1" /></label>
    <label>Zoom <input id="e_zoom" type="range" min="1" max="4" step="0.01" /></label>
    <span class="row2">
      <label>Pan X <input id="e_panX" type="range" min="-1" max="1" step="0.01" /></label>
      <label>Pan Y <input id="e_panY" type="range" min="-1" max="1" step="0.01" /></label>
    </span>
    <label class="check"><input id="e_mirror" type="checkbox" /> Mirror</label>
    <h3>Name tag</h3>
    <label class="check"><input id="e_nameTag" type="checkbox" /> Show name tag</label>
    <label>Title <input id="e_nameTagText" placeholder="(participant name)" /></label>
    <label>Subtitle <input id="e_nameTagSubtitle" /></label>
    <label>Position
      <select id="e_nameTagPosition"><option value="bl">Bottom left</option><option value="br">Bottom right</option><option value="tl">Top left</option><option value="tr">Top right</option></select>
    </label>
    <div class="drawer-actions">
      <button id="d_resetFx">Reset picture</button>
      <button id="d_delete" class="danger">Delete output</button>
    </div>
  </div>
</div>

<footer>
  <details id="logDrawer">
    <summary>Log</summary>
    <pre id="log"></pre>
  </details>
</footer>

<script src="cjs-shim.js"></script>
<script src="../dist/control/ui.js"></script>
</body>
</html>
