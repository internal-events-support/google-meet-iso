# Builds the Windows installer + portable zip and publishes a GitHub Release
# whenever a version tag (v*.*.*) is pushed. Cut a version with:
#   npm version <patch|minor|major|x.y.z> && git push --follow-tags
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NDI_SDK_DIR: C:\NDI6SDK
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "::error::Tag $TAG != package.json v$v"; exit 1; }

      # The addon only needs the NDI headers at build time; the runtime is loaded
      # dynamically on the user's machine (NDI Tools / NDI Runtime).
      # Unpack the Inno Setup installer with innoextract (running it silently hangs on CI).
      - name: Fetch NDI 6 SDK (headers)
        shell: pwsh
        timeout-minutes: 10
        run: |
          choco install innoextract -y --no-progress
          Invoke-WebRequest -Uri 'https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe' -OutFile ndi-sdk.exe
          innoextract -s -d ndi-x ndi-sdk.exe
          $h = Get-ChildItem -Recurse ndi-x -Filter Processing.NDI.Lib.h | Select-Object -First 1
          if (-not $h) { throw 'NDI SDK headers not found' }
          New-Item -ItemType Directory -Force $env:NDI_SDK_DIR | Out-Null
          Copy-Item -Recurse $h.Directory.FullName "$env:NDI_SDK_DIR\Include"
          Get-ChildItem "$env:NDI_SDK_DIR\Include"

      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-osc.js

      - name: Build installer
        run: npm run dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(release/*.exe release/*.zip release/*.blockmap)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "GMeet ISO $TAG" --generate-notes
          fi
